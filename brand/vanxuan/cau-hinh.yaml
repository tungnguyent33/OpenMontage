# Font cần chép vào brand/<id>/assets/fonts/ (tìm trong <kênh>/fonts/ trước, sau đó font đã cài trên máy)
fonts:
  - BeVietnamPro-ExtraBold.ttf
  - BeVietnamPro-Bold.ttf
